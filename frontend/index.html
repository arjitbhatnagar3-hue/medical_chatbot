<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediBot — Medical Assistant</title>
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --accent: #14b8a6;
      --bg: #eef2f7;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bot-bubble: #f8fafc;
      --user-bubble: linear-gradient(135deg, #0ea5e9, #2563eb);
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header ---------- */
    header {
      background: linear-gradient(135deg, #0ea5e9, #14b8a6);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      z-index: 10;
    }
    .logo {
      width: 42px; height: 42px;
      background: rgba(255,255,255,.18);
      border-radius: 12px;
      display: grid; place-items: center;
      backdrop-filter: blur(4px);
    }
    .logo svg { width: 24px; height: 24px; }
    .title-block h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .2px; }
    .title-block p { margin: 2px 0 0; font-size: 12px; opacity: .9; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .status { display: flex; align-items: center; gap: 7px; font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.25); transition: .3s; }
    .dot.online { background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.25); }
    .new-chat {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: .2s;
    }
    .new-chat:hover { background: rgba(255,255,255,.3); }

    /* ---------- Chat area ---------- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg { display: flex; gap: 12px; align-items: flex-end; animation: rise .25s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 34px; height: 34px; flex: 0 0 34px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 16px; color: #fff;
    }
    .avatar.bot { background: linear-gradient(135deg, #14b8a6, #0ea5e9); }
    .avatar.user { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .col { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
    .msg.user .col { align-items: flex-end; }
    .bubble {
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: var(--shadow);
      font-size: 15px;
    }
    .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
    .time { font-size: 10px; color: var(--muted); padding: 0 4px; }

    .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      background: #ecfeff; border: 1px solid #a5f3fc; color: #0e7490;
      padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
    }

    .typing .bubble { display: flex; gap: 4px; padding: 14px 16px; }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite both; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }

    /* ---------- Welcome screen ---------- */
    .welcome { margin: auto; text-align: center; max-width: 560px; padding: 20px; animation: rise .3s ease; }
    .welcome .big-logo {
      width: 72px; height: 72px; margin: 0 auto 18px;
      background: linear-gradient(135deg, #0ea5e9, #14b8a6);
      border-radius: 20px; display: grid; place-items: center; box-shadow: var(--shadow);
    }
    .welcome h2 { margin: 0 0 8px; font-size: 24px; }
    .welcome p { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .suggest {
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      padding: 10px 16px; border-radius: 12px; cursor: pointer; font-size: 14px;
      box-shadow: var(--shadow); transition: .2s;
    }
    .suggest:hover { border-color: var(--primary); transform: translateY(-2px); }

    /* ---------- Input ---------- */
    .input-wrap {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
    }
    form {
      max-width: 820px; margin: 0 auto;
      display: flex; gap: 10px; align-items: flex-end;
    }
    .field {
      flex: 1; display: flex; align-items: center;
      background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 4px 6px 4px 14px;
    }
    .field:focus-within { border-color: var(--primary); }
    textarea {
      flex: 1; resize: none; border: none; background: transparent; outline: none;
      font-family: inherit; font-size: 15px; color: var(--text); padding: 10px 6px; max-height: 140px; line-height: 1.4;
    }
    button.send {
      width: 46px; height: 46px; flex: 0 0 46px; border: none; border-radius: 14px;
      background: var(--user-bubble); color: #fff; cursor: pointer; display: grid; place-items: center; transition: .2s;
    }
    button.send:hover { filter: brightness(1.08); }
    button.send:disabled { opacity: .5; cursor: not-allowed; }
    button.send svg { width: 20px; height: 20px; }
    footer { text-align: center; font-size: 11px; color: var(--muted); padding: 6px; }

    .banner {
      background: #fef2f2; color: #b91c1c; border-bottom: 1px solid #fecaca;
      font-size: 13px; padding: 8px 20px; text-align: center; display: none;
    }
    .banner.show { display: block; }

    @media (max-width: 600px) {
      .col { max-width: 85%; }
      #messages { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l2 5 4-12 2 7h6"/>
      </svg>
    </div>
    <div class="title-block">
      <h1>MediBot</h1>
      <p>Evidence-based answers from your medical book</p>
    </div>
    <div class="header-right">
      <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">connecting…</span></div>
      <button class="new-chat" id="new-chat">New chat</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div id="messages"></div>

  <div class="input-wrap">
    <form id="chat-form">
      <div class="field">
        <textarea id="user-input" rows="1" placeholder="Ask a medical question…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      </div>
      <button type="submit" class="send" id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2z"/>
        </svg>
      </button>
    </form>
    <footer>This AI assistant is not a substitute for professional medical advice.</footer>
  </div>

  <script>
    // Empty string = same-origin (recommended when served by FastAPI).
    // Set to "http://127.0.0.1:8000" only if you serve the frontend separately.
    const API_BASE = "";
    const STORAGE_KEY = "medibot_history";

    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const banner = document.getElementById("banner");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");

    const SUGGESTIONS = [
      "What are the common symptoms of dengue fever?",
      "How is type 2 diabetes usually diagnosed?",
      "What are the side effects of aspirin?",
      "How should minor burns be treated at home?"
    ];

    function nowTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function showWelcome() {
      const wrap = document.createElement("div");
      wrap.className = "welcome";
      wrap.id = "welcome";
      wrap.innerHTML = `
        <div class="big-logo">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h4l2 5 4-12 2 7h6"/>
          </svg>
        </div>
        <h2>Ask your medical book</h2>
        <p>Get clear answers with page references. Try one of these to start:</p>
        <div class="chips">
          ${SUGGESTIONS.map(s => `<button class="suggest">${s}</button>`).join("")}
        </div>`;
      messagesEl.appendChild(wrap);
      wrap.querySelectorAll(".suggest").forEach(btn => {
        btn.addEventListener("click", () => {
          input.value = btn.textContent;
          form.requestSubmit();
        });
      });
    }

    function removeWelcome() {
      const w = document.getElementById("welcome");
      if (w) w.remove();
    }

    function avatar(role) {
      if (role === "user") return `<div class="avatar user">🧑</div>`;
      return `<div class="avatar bot">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l2 5 4-12 2 7h6"/>
        </svg></div>`;
    }

    function addMessage(role, text, sources, save = true) {
      removeWelcome();
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      wrap.innerHTML = avatar(role) + `<div class="col"></div>`;
      const col = wrap.querySelector(".col");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      col.appendChild(bubble);

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = nowTime();
      col.appendChild(time);

      if (role === "bot" && sources && sources.length) {
        const cites = document.createElement("div");
        cites.className = "cites";
        sources.forEach(s => {
          const chip = document.createElement("span");
          chip.className = "chip";
          const page = (s.page !== undefined && s.page !== null && s.page !== "unknown") ? " · p." + s.page : "";
          chip.textContent = "📄 " + (s.source || "unknown") + page;
          cites.appendChild(chip);
        });
        col.appendChild(cites);
      }

      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      if (save) saveHistory();
    }

    function showTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.id = "typing";
      wrap.innerHTML = avatar("bot") + `<div class="col"><div class="bubble typing"><span></span><span></span><span></span></div></div>`;
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function removeTyping() { const t = document.getElementById("typing"); if (t) t.remove(); }

    function saveHistory() {
      const items = [...messagesEl.querySelectorAll(".msg")].map(m => {
        const bubble = m.querySelector(".bubble");
        const isUser = m.classList.contains("user");
        const sources = [...m.querySelectorAll(".chip")].map(c => ({ source: c.textContent }));
        return { role: isUser ? "user" : "bot", text: bubble ? bubble.textContent : "", sources };
      }).filter(i => i.text && !i.text.includes("typing"));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function restoreHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) { showWelcome(); return; }
        const items = JSON.parse(raw);
        if (!items.length) { showWelcome(); return; }
        items.forEach(i => addMessage(i.role, i.text, i.sources || [], false));
      } catch (_) { showWelcome(); }
    }

    function showBanner(msg) { banner.textContent = msg; banner.classList.add("show"); }
    function hideBanner() { banner.classList.remove("show"); }

    async function checkHealth() {
      try {
        const res = await fetch(API_BASE + "/health");
        const data = await res.json();
        if (data.status === "ok") {
          statusDot.classList.add("online");
          statusText.textContent = "online";
          hideBanner();
        } else {
          statusDot.classList.remove("online");
          statusText.textContent = "error";
          showBanner("Backend issue: " + data.detail);
        }
      } catch (_) {
        statusDot.classList.remove("online");
        statusText.textContent = "offline";
        showBanner("Cannot reach the backend at " + (API_BASE || location.origin) + "/health");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      addMessage("user", q);
      input.value = "";
      autoGrow();
      input.disabled = true;
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch(API_BASE + "/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
        removeTyping();
        if (!res.ok) {
          let detail = res.statusText;
          try { detail = (await res.json()).detail || detail; } catch (_) {}
          addMessage("bot", "⚠️ " + detail);
        } else {
          const data = await res.json();
          addMessage("bot", data.answer, data.sources || []);
        }
      } catch (err) {
        removeTyping();
        addMessage("bot", "⚠️ Network error — is the backend running?\n(" + err.message + ")");
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    });

    function autoGrow() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }
    input.addEventListener("input", autoGrow);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    document.getElementById("new-chat").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      messagesEl.innerHTML = "";
      showWelcome();
      input.focus();
    });

    // Init
    restoreHistory();
    checkHealth();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>
